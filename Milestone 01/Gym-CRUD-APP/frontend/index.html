<!DOCTYPE html>
<html>
<head>
  <title>Gym Tracker</title>
</head>
<body>
  <h1>Gym Tracker</h1>

  <form id="form">
    <input placeholder="Exercise" id="exercise" required />
    <input placeholder="Weight" id="weight" type="number" required />
    <input placeholder="Reps" id="reps" type="number" required />
    <input type="date" id="date" required />
    <button>Add</button>
  </form>

  <ul id="list"></ul>

  <script src="script.js"></script>
</body>
</html>
